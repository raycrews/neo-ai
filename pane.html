<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outline — Neo-AI</title>
  <link rel="stylesheet" href="pane.css">
  <link rel="stylesheet" href="appearance.css">
  <script src="appearance.js" defer></script>
</head>
<body class="outline-pane">
  <header><div><h1>Outline</h1><p id="book-title">Open a book in the workspace</p></div><button id="dock" type="button">Return to workspace</button></header>
  <div class="toolbar"><button id="add-chapter" type="button" disabled>+ Chapter</button><span id="status" role="status">Connected to the writing workspace</span></div>
  <section id="error-box" hidden role="alert"><p id="error"></p><label for="recovery">Unsaved draft — copy before discarding</label><textarea id="recovery" readonly></textarea><button id="retry" type="button">Apply my draft over latest text</button><button id="discard" type="button">Discard unsaved edits</button></section>
  <main id="outline"><p class="empty">Open a book to see its chapters and sections here.</p></main>
  <script src="pane.js"></script>
</body>
</html>
