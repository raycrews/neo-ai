name: Build Neo-AI Desktop

on:
  push:
    tags: ['v*']
  pull_request:
    paths-ignore: ['pocket/**', '**/*.md']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test detached windows (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:panes
      - name: Test detached windows (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:panes
      - name: Test app settings (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:settings
      - name: Test app settings (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:settings
      - name: Test AI chat (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:chat
      - name: Test AI chat (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:chat
      - name: Package Windows or Linux
        if: runner.os != 'macOS'
        run: npx electron-builder --${{ matrix.platform }} --publish never
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CSC_LINK" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            npx electron-builder --mac --publish never
          else
            echo "Building unsigned development artifacts; configure Apple signing secrets for distribution."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --config.mac.notarize=false --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: neo-ai-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: neo-ai-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
